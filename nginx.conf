# nginx del frontend TallerPro (imagen nginx-unprivileged, puerto 8080 dentro del contenedor).
# - Sirve el sitio estatico de Astro.
# - Fallback SPA: /app/* -> /app/index.html (React Router resuelve en el cliente).
# - Proxea /api/ al api-gateway (mismo origen: sin CORS ni mixed content).
# - Nunca sirve archivos ocultos (.env, .git, ...).
# TLS: terminarlo en un reverse proxy / balanceador delante de este contenedor (ver DEPLOY.md).

server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    client_max_body_size 5m;
    # Redirecciones relativas (/login -> /login/): detras de un proxy TLS, nginx no debe
    # armar una URL absoluta con su esquema y puerto internos (http://host:8080/...).
    absolute_redirect off;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # Archivos ocultos (.env, .git/, .DS_Store, ...): 404 siempre.
    location ~ /\. {
        return 404;
    }

    # API -> gateway (red interna de Docker). El header Authorization pasa tal cual.
    location /api/ {
        proxy_pass http://api-gateway:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Assets con hash en el nombre: cache larga.
    location /_astro/ {
        add_header X-Content-Type-Options "nosniff" always;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Deep-links de la SPA.
    location /app/ {
        try_files $uri $uri/ /app/index.html;
    }

    location / {
        try_files $uri $uri/ $uri.html =404;
    }
}
